# Versamel elke 4 uur high-elo wedstryde en publiseer die build-statistieke as builds.json
# in die "build-data" release. Elke RiftScout-app laai dit af, sodat almal dadelik builds het.
#
# Nodig: 'n repo-secret RIOT_API_KEY (Settings > Secrets and variables > Actions).
# 'n Development key verval elke 24 uur. Riot se portaal (developer.riotgames.com/docs/portal): 'n publieke produk
# mag nie 'n development- of personal key gebruik nie; dit het 'n Production key nodig (sien README).
# Elke run skryf build-status.json (ook as die sleutel verval het); builds.json net as daar nuwe games is.

name: Collect build data

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How many minutes to collect (the first run can be short so data arrives quickly)'
        required: false
        default: '200'
      region:
        description: 'Servers to collect high-elo games from: all, or a list like euw1,na1,kr'
        required: false
        default: 'all'

permissions:
  contents: write

concurrency:
  group: collect-builds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for Riot API key
        id: key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "No RIOT_API_KEY secret set - skipping. Add it under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Ook sonder sleutel: dan skryf die versamelaar net 'n status "key_missing" (die run bly groen)
      - name: Download previous data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-data -p 'builds*.json' -p 'build-status.json' --clobber || echo "No previous data yet."

      # Skryf altyd build-status.json; builds.json verander net as daar nuwe games is (published=true)
      - name: Collect matches
        id: collect
        continue-on-error: true
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node tools/collect.js --region "${{ github.event.inputs.region || 'all' }}" --minutes "${{ github.event.inputs.minutes || '200' }}" --file builds.json --seen builds-seen.json --status build-status.json

      - name: Make sure the release exists
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-data > /dev/null 2>&1 || gh release create build-data --prerelease --latest=false \
            --title "Build data" --notes "Build statistics collected automatically from high-elo ranked games. Used by the RiftScout app - not an app release."

      # Net as daar nuwe games is: anders sou die app 'n nuwe "laas opgedateer"-tyd wys sonder nuwe data
      - name: Publish data
        if: always() && steps.collect.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f builds.json ] || exit 0
          gzip -9 -kf builds.json
          gh release upload build-data builds.json builds.json.gz builds-seen.json --clobber

      - name: Publish collector status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build-status.json ] || exit 0
          cat build-status.json
          gh release upload build-data build-status.json --clobber

      # Die run bly rooi as die versameling misluk het (dan kry die eienaar 'n e-pos), maar eers ná die status
      - name: Fail if collecting failed
        if: steps.key.outputs.ok == 'true' && steps.collect.outcome == 'failure'
        run: |
          echo "Collecting failed: ${{ steps.collect.outputs.error }}"
          exit 1
